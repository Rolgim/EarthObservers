<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Earth observation satellites in 3D, at their real position, with sourced facts, instruments and real archive data. In English and French.">
<title>Earth Observers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14171A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* Parti pris : une fiche technique imprimée (papier gris froid, encre noire, une seule famille de caractères)
   posée à côté d'un hublot noir sur la maquette. Un seul accent : le bleu de surlignage, réservé à « ce qui est sélectionné ». */
:root{
  --paper:#ECEEEF; --sheet:#F7F8F8; --ink:#14171A; --ink-2:#3A4147; --mute:#5A6369; --rule:#C8CDD1; --rule-2:#98A1A7;
  --mark:#2F6FE4; --on-mark:#FFFFFF; --black:#000; --ok:#0B7A4B; --on-ok:#FFFFFF; --on-bad:#FFFFFF; --warn:#8A5200; --bad:#B3261E;
  --f:'Archivo', 'Helvetica Neue', Arial, sans-serif; --f-code:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
/* thème sombre : gris anthracite, distinct du noir du ciel */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#1C1F22; --sheet:#262A2E; --ink:#F1F3F4; --ink-2:#C6CCD1; --mute:#939CA3; --rule:#3B4147; --rule-2:#5C656D; --ok:#2FA872; --on-ok:#0E1A14; --on-bad:#14171A; --warn:#E3A33C; --bad:#D9463C; color-scheme:dark; } }
:root[data-theme="dark"]{ --paper:#1C1F22; --sheet:#262A2E; --ink:#F1F3F4; --ink-2:#C6CCD1; --mute:#939CA3; --rule:#3B4147; --rule-2:#5C656D; --ok:#2FA872; --on-ok:#0E1A14; --on-bad:#14171A; --warn:#E3A33C; --bad:#D9463C; color-scheme:dark; }
/* couleurs neutres écrites dans les SVG générés : ramenées aux jetons du thème */
svg [fill="#14171A"]{ fill:var(--ink); } svg [stroke="#14171A"]{ stroke:var(--ink); }
svg [fill="#3A4147"]{ fill:var(--ink-2); } svg [stroke="#3A4147"]{ stroke:var(--ink-2); }
svg [fill="#667077"]{ fill:var(--mute); } svg [stroke="#98A1A7"]{ stroke:var(--rule-2); } svg [stroke="#C8CDD1"]{ stroke:var(--rule); }
svg [fill="#F7F8F8"]{ fill:var(--sheet); } svg [fill="#ECEEEF"]{ fill:var(--paper); }
svg [fill="#FFD21F"][stroke="#14171A"]{ stroke:var(--on-mark); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ height:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f); font-size:14px; overflow:hidden; }
button{ font-family:inherit; color:inherit; }
button:focus-visible, a:focus-visible, input:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
#stage button:focus-visible, #stage input:focus-visible{ outline-color:#fff; outline-offset:3px; }

#app{ height:100%; display:flex; flex-direction:column; min-height:0; position:relative; }

/* ---------- en-tête ---------- */
#top{ flex:none; display:flex; min-height:55px; align-items:stretch; gap:24px; padding-left:var(--gl); padding-right:var(--gr); background:var(--paper); }
.brand{ display:flex; align-items:center; min-width:0; padding-block:11px; }
.brand h1{ font-weight:800; font-stretch:75%; font-size:21px; letter-spacing:.1px; margin:0; white-space:nowrap; }
/* navigation en deux rangées : domaines spectraux (filtres), puis observatoires du domaine choisi */
#tabs{ display:flex; flex-direction:column; margin-left:auto; min-width:0; }
.drow, .trow{ display:flex; overflow-x:auto; scrollbar-width:none; min-width:0; }
.drow::-webkit-scrollbar, .trow::-webkit-scrollbar{ display:none; }
.trow{ flex:1; justify-content:flex-end; }
.drow{ justify-content:flex-end; gap:2px; padding-top:5px; }
.dsel{ flex:none; border:0; background:transparent; color:var(--mute); font-size:12px; font-weight:500; padding:2px 8px 3px; cursor:pointer; border-bottom:2px solid transparent; display:flex; align-items:baseline; gap:4px; white-space:nowrap; }
.dsel:hover{ color:var(--ink); }
.dsel[aria-pressed="true"]{ color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
.dsel .dn{ font-size:10.5px; color:var(--mute); font-weight:400; font-variant-numeric:tabular-nums; }
.dsel.cur .dl::after, .dsel.cur .ds::after{ content:""; display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--mark); margin-left:4px; vertical-align:2px; }
.dsel .ds{ display:none; }
.tab{ flex:none; position:relative; border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink-2); cursor:pointer; padding:6px 16px 8px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; margin-top:4px; }
/* groupes par domaine spectral : un trait plein entre les groupes, pointillé à l'intérieur, le nom du groupe au-dessus de son premier onglet */
.tab small{ font-size:11.5px; font-weight:400; color:var(--mute); font-variant-numeric:tabular-nums; }
.tab:hover{ background:var(--sheet); color:var(--ink); }
.tab[aria-selected="true"]{ background:var(--mark); color:var(--on-mark); }
.tab[aria-selected="true"] small{ color:var(--on-mark); opacity:.75; }

/* ---------- vue 3D ---------- */
#main{ flex:1; display:flex; min-height:0; position:relative; }
#stage{ flex:1; position:relative; min-width:0; min-height:0; background:var(--black); color:#fff; }
#stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
#stage canvas.dragging{ cursor:grabbing; }
#stage canvas.over-part{ cursor:pointer; }

.hud{ position:absolute; pointer-events:none; }
#hud-title{ left:var(--gl); top:16px; right:var(--gr); }
#t-name{ font-weight:800; font-stretch:75%; font-size:clamp(24px, 3.4vw, 40px); line-height:1; text-shadow:0 2px 14px #000; }
#t-sub{ color:#C9CED2; font-size:13px; margin-top:7px; text-shadow:0 1px 8px #000; }
#t-src{ color:#8E979D; font-size:11.5px; margin-top:3px; text-shadow:0 1px 8px #000; }

#hover-tip{ position:absolute; pointer-events:none; padding:3px 8px; background:#fff; color:#14171A; font-size:12px; font-weight:600; max-width:260px; transform:translate(12px, 14px); z-index:3; }
#dep{ position:absolute; left:50%; bottom:calc(66px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); width:min(560px, calc(100% - 24px)); background:var(--paper); color:var(--ink); padding:10px 14px 8px; z-index:3; border-top:3px solid var(--mark); }
#dep-date{ font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
#dep-title{ font-size:15px; }
#dep-text{ margin:4px 0 8px; font-size:13px; line-height:1.4; color:var(--ink-2); min-height:2.8em; }
#dep-range{ flex:1; min-width:0; accent-color:var(--ink); }
.dep-b{ height:30px; min-width:30px; padding:0 10px; border:1px solid var(--rule-2); background:transparent; color:var(--ink); font:600 14px var(--f); cursor:pointer; }
.dep-b:hover{ background:var(--sheet); }
.explode[hidden]{ display:none; }
#cut-note{ position:absolute; right:12px; top:12px; max-width:min(420px, calc(100% - 24px)); margin:0; padding:6px 10px; background:var(--paper); color:var(--ink); font-size:12px; line-height:1.4; border-left:3px solid var(--mark); z-index:2; pointer-events:none; }
#callout{ position:absolute; pointer-events:none; transform:translate(-50%, -150%); padding:3px 9px; background:var(--mark); color:var(--on-mark); font-size:12.5px; font-weight:700; white-space:nowrap; z-index:2; }
#callout::after{ content:""; position:absolute; left:50%; top:100%; width:2px; height:12px; margin-left:-1px; background:var(--mark); }
#hint{ position:absolute; left:50%; bottom:calc(66px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); font-size:12px; color:#AEB5BA; pointer-events:none; text-shadow:0 1px 6px #000; white-space:nowrap; transition:opacity .6s; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
#hint.gone{ opacity:0; }

#toolbar{ position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); display:flex; align-items:stretch; background:var(--paper); color:var(--ink); max-width:calc(100% - 24px); }
.tool{ display:flex; align-items:center; gap:7px; height:38px; padding:0 13px; border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
.tool svg{ width:16px; height:16px; flex:none; }
.tool:hover{ background:var(--sheet); }
.tool[aria-pressed="true"]{ background:var(--mark); color:var(--on-mark); }
.tool:disabled{ opacity:.35; cursor:default; }
.explode{ display:flex; align-items:center; gap:9px; padding:0 13px; height:38px; color:var(--ink); font-size:13px; font-weight:600; }
.explode svg{ width:16px; height:16px; }
.explode input{ width:120px; accent-color:var(--ink); }
.explode input:disabled{ opacity:.5; }

#loader{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(0,0,0,.78); z-index:4; text-align:center; padding:0 24px; }
#loader .bar{ width:min(280px, 70%); height:4px; background:#33393E; overflow:hidden; }
#loader .bar i{ display:block; height:100%; width:0%; background:var(--mark); transition:width .15s linear; }
#loader button{ border:0; background:var(--mark); color:var(--on-mark); padding:8px 16px; cursor:pointer; font-size:13px; font-weight:700; }

#cmp-labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }

/* ---------- fiche ---------- */
#panel{ width:400px; flex:none; display:flex; flex-direction:column; min-height:0; background:var(--paper); }
#ptabs{ flex:none; display:flex; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule-2); }
.ptab{ flex:1; padding:11px 8px 10px; background:transparent; border:0; border-right:1px solid var(--rule); color:var(--ink-2); cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; }
.ptl{ display:contents; }
.ptab:last-child{ border-right:0; }
.ptl:not(:last-child) .ptab:last-child{ border-right:1px solid var(--rule); }
.ptab:hover{ background:var(--sheet); }
.ptab[aria-selected="true"]{ background:var(--mark); color:var(--on-mark); }
.ptab .n{ font-weight:400; margin-left:5px; opacity:.7; font-variant-numeric:tabular-nums; }
.ptab.go{ text-decoration:underline; text-underline-offset:3px; }
#pbody{ flex:1; overflow-y:auto; padding:20px 22px calc(28px + env(safe-area-inset-bottom, 0px)); padding-right:max(22px, env(safe-area-inset-right, 0px)); -webkit-overflow-scrolling:touch; }
#pbody h2{ font-weight:800; font-stretch:75%; font-size:26px; line-height:1.05; margin:0; text-wrap:balance; }
.launch{ color:var(--mute); font-size:12.5px; margin-top:6px; line-height:1.5; }
.facts{ display:grid; grid-template-columns:1fr 1fr; margin-top:16px; border-top:2px solid var(--ink); border-left:1px solid var(--rule); }
.facts div{ padding:8px 10px 9px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); min-width:0; }
.facts dt{ font-size:11.5px; color:var(--mute); }
.facts dd{ margin:2px 0 0; font-weight:700; font-stretch:75%; font-size:19px; line-height:1.15; font-variant-numeric:tabular-nums; }
.facts dd small{ font-size:12px; font-weight:500; font-stretch:100%; color:var(--ink-2); }
.desc{ font-size:14px; line-height:1.6; color:var(--ink); margin:16px 0 0; }
.where{ margin-top:16px; background:var(--sheet); border:1px solid var(--rule); padding:10px 10px 6px; }
.where svg{ width:100%; height:auto; display:block; }
.spec-section{ margin-top:24px; }
.spec-section-title{ font-weight:800; font-stretch:75%; font-size:16px; padding-bottom:5px; border-bottom:2px solid var(--ink); }
.spec-row{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; }
.spec-row .k{ color:var(--ink-2); flex:0 0 auto; max-width:44%; }
.spec-row .v{ text-align:right; font-weight:600; min-width:0; line-height:1.4; font-variant-numeric:tabular-nums; }
.source-note{ font-size:12px; line-height:1.55; color:var(--mute); margin-top:20px; }
.cta{ display:block; width:100%; margin-top:16px; padding:11px 14px; text-align:left; border:2px solid var(--ink); background:var(--sheet); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; }
.cta:hover{ background:var(--mark); color:var(--on-mark); }
.cta:hover small{ color:var(--on-mark); }
.cta small{ display:block; font-size:12px; color:var(--ink-2); margin-top:3px; font-weight:400; line-height:1.4; }
.part{ border-bottom:1px solid var(--rule); }
.part:first-of-type{ border-top:2px solid var(--ink); }
.part > button{ display:flex; width:100%; align-items:center; gap:10px; text-align:left; padding:10px 8px; background:transparent; border:0; cursor:pointer; font-size:14px; font-weight:600; }
.part > button:hover{ background:var(--sheet); }
.part .dot{ width:9px; height:9px; border:1.5px solid var(--ink); flex:none; }
.part.on > button{ background:var(--mark); color:var(--on-mark); }
.part.on .dot{ background:var(--on-mark); border-color:var(--on-mark); }
.part .pd{ display:none; padding:10px 8px 14px 27px; font-size:13.5px; line-height:1.6; }
.part.on .pd{ display:block; }
.part .pf{ margin-top:10px; padding-top:8px; border-top:1px solid var(--rule); font-size:12.5px; line-height:1.7; font-weight:600; font-variant-numeric:tabular-nums; }
.barcell{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
.barcell i{ display:block; height:8px; background:var(--ink); min-width:2px; }
.barcell i.alt{ background:var(--rule-2); }

#err-banner{ position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); background:var(--bad); color:var(--on-bad); font-size:12.5px; padding:9px 13px; z-index:999; max-width:88vw; }

@media (max-width: 860px){
  #top{ flex-direction:column; gap:0; padding:0; }
  .brand{ padding:9px var(--gr) 8px var(--gl); }
  .brand h1{ font-size:18px; }
  #tabs{ margin-left:0; border-top:1px solid var(--rule); }
  .drow{ justify-content:flex-start; padding:4px var(--gr) 0 var(--gl); gap:0; }
  .dsel{ padding:3px 7px 4px; font-size:12px; }
  .dsel:first-child{ padding-left:0; }
  .dsel .dl{ display:none; } .dsel .ds{ display:inline; }
  .dsel .dn{ display:none; }
  .trow{ justify-content:flex-start; border-top:1px solid var(--rule); }
  .tab{ padding:9px 13px; font-size:13.5px; margin-top:0; }
  #tabs .tab{ flex:1 1 auto; padding:9px 6px; justify-content:center; }   /* quatre observatoires et « Comparer » tiennent sur 400 px */
  .tab:first-child{ border-left:0; }
  .tab small{ display:none; }
  .tab.util{ padding:0 8px; }
  #utils{ position:absolute; top:0; right:var(--gr); height:40px; margin:0; }
  #main{ flex-direction:column; }
  #stage{ flex:0 0 46%; }
  #panel{ width:auto; flex:1; }
  #pbody{ padding-left:var(--gl); padding-right:var(--gr); }
  #hud-title{ top:10px; }
  #t-src, #hint{ display:none; }
  .tool{ padding:0 11px; }
  .explode input{ width:84px; }
  #toolbar{ bottom:8px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.001ms !important; animation-duration:.001ms !important; } }

/* réglages (langue, thème) : icônes discrètes, séparées des onglets d'observatoires */
.tab.util{ border-left:0; align-items:center; padding:0 9px; color:var(--mute); gap:4px; }
.tab.util:hover{ background:transparent; color:var(--ink); }
#utils{ display:flex; flex:none; margin-left:14px; }
#top{ position:relative; }
.tab.util svg{ width:18px; height:18px; display:block; }
.tab.util span{ font-size:11.5px; font-weight:700; letter-spacing:.4px; }

/* appels de source et liste des sources */
sup.ref{ font-size:10px; font-weight:600; color:var(--mute); margin-left:3px; vertical-align:super; line-height:0; }
sup.ref.nv{ color:var(--warn); cursor:help; }
ol.refs{ margin:8px 0 0; padding-left:20px; font-size:12px; line-height:1.5; color:var(--ink-2); }
ol.refs li{ margin-bottom:6px; overflow-wrap:anywhere; }
ol.refs a{ color:var(--ink); text-underline-offset:2px; }
ol.refs span{ color:var(--mute); }

/* ---------- glossaire (lot C1) ---------- */
abbr.gl{ text-decoration:underline dotted; text-decoration-color:var(--mute); text-underline-offset:3px; text-decoration-thickness:1px; cursor:help; border-radius:2px; }
abbr.gl:hover, abbr.gl:focus-visible{ text-decoration-color:var(--ink); background:color-mix(in srgb, var(--mark) 35%, transparent); outline:none; }
#gloss-tip{ position:fixed; z-index:60; padding:10px 12px; background:var(--sheet); color:var(--ink); border:1px solid var(--ink); box-shadow:3px 3px 0 var(--mark); font-size:13px; line-height:1.5; pointer-events:none; }
#gloss-tip b{ display:block; font-weight:700; margin-bottom:3px; }

/* accessibilité : texte lu par les lecteurs d'écran, invisible à l'écran ; focus de la vue 3D */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
#stage canvas:focus-visible{ outline:2px solid var(--mark); outline-offset:-4px; }

/* sources sous les faits d'une pièce */
ol.refs.pref{ margin:8px 0 0; padding-left:18px; font-size:11.5px; line-height:1.45; color:var(--ink-2); }
ol.refs.pref li{ margin:0 0 2px; }

/* onglet Mission */
.ms-tl{ list-style:none; margin:0; padding:0; }
.ms-tl li{ display:grid; grid-template-columns:7.4em 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); }
.ms-tl li:last-child{ border-bottom:0; }
.ms-d{ font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; line-height:1.35; }
.ms-d small{ display:block; color:var(--warn); font-size:11px; margin-top:2px; }
.ms-tl strong, .ms-chain strong{ font-size:13.5px; }
.ms-tl p, .ms-chain p{ margin:3px 0 0; font-size:13px; line-height:1.45; color:var(--ink-2); }
.ms-intro{ font-size:13px; line-height:1.5; color:var(--ink-2); margin:8px 0 10px; }
.ms-chain{ list-style:none; margin:0; padding:0; counter-reset:ms; }
.ms-chain li{ position:relative; display:grid; grid-template-columns:6.6em 1fr; gap:10px; padding:0 0 14px; }
.ms-chain li::before{ content:""; position:absolute; left:3.3em; top:24px; bottom:0; width:2px; background:var(--rule-2); }
.ms-chain li:last-child::before{ display:none; }
.ms-lv{ position:relative; z-index:1; align-self:start; text-align:center; padding:3px 4px; background:var(--mark); color:var(--on-mark); font-family:var(--f-code); font-size:11px; font-weight:600; line-height:1.3; word-break:break-word; }
.ms-st code{ display:inline-block; margin-top:5px; font-family:var(--f-code); font-size:11.5px; color:var(--ink); background:var(--sheet); border:1px solid var(--rule); padding:1px 6px; }

/* vues d'ensemble (Comparer, Flotte) : boutons à part des onglets d'observatoires */
#views{ display:flex; flex:none; align-items:center; gap:6px; margin-left:14px; }
.vbtn{ border:1.5px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-size:13.5px; font-weight:700; padding:6px 12px; cursor:pointer; }
.vbtn:hover{ background:var(--sheet); }
.vbtn[aria-pressed="true"]{ background:var(--mark); border-color:var(--mark); color:var(--on-mark); }
@media (max-width: 860px){
  #views{ margin:0; gap:6px; padding:5px var(--gr) 5px var(--gl); border-top:1px solid var(--rule); }
  .vbtn{ font-size:12.5px; padding:3px 10px; }
}
#tabs:empty{ border:0; }

/* ===== Instruments et données : un manuel d'instrument, sur toute la largeur ===== */
#inst-page{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--paper); }
.pill{ flex:none; border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink-2); font-size:14px; font-weight:600; padding:6px 16px; cursor:pointer; }
.pill:last-child{ border-right:1px solid var(--rule); }
.pill:hover{ background:var(--sheet); }
.pill.on{ background:var(--mark); color:var(--on-mark); }
.inst-body{ flex:1; display:flex; min-height:0; }
.inst-nav{ width:232px; flex:none; border-right:1px solid var(--ink); overflow-y:auto; padding-left:env(safe-area-inset-left, 0px); }
.nav-i{ display:block; width:100%; text-align:left; padding:10px 14px 10px 12px; border:0; border-bottom:1px solid var(--rule); border-left:6px solid var(--c, transparent); background:transparent; cursor:pointer; }
.nav-i .n{ display:block; font-weight:700; font-size:14px; }
.nav-i .k{ display:block; font-size:12px; color:var(--mute); margin-top:1px; }
.nav-i:hover{ background:var(--sheet); }
.nav-i.on{ background:var(--mark); color:var(--on-mark); }
.nav-i.on .k{ color:var(--on-mark); opacity:.8; }

.m-panel .cta{ display:block; width:100%; text-align:left; margin-top:20px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font:700 14px var(--f); padding:10px 12px; cursor:pointer; }

.parts{ list-style:none; margin:0; padding:0; }
.part > button{ width:100%; text-align:left; border:0; border-bottom:1px solid var(--rule); background:transparent; font:600 14px var(--f); color:var(--ink); padding:9px 2px; cursor:pointer; }
.part.on > button{ background:var(--mark); color:var(--on-mark); padding-left:8px; }
.part-body{ font-size:13.5px; line-height:1.45; color:var(--ink-2); padding:4px 2px 10px; }
.note{ font-size:12px; color:var(--ink-2); margin-top:14px; }
.sk.wide{ max-width:960px; }
.sk.full{ max-width:none; }
.traj svg{ width:100%; max-width:520px; height:auto; background:var(--black); display:block; }
.traj .sun{ fill:#FFD21F; }
.traj .orb-b{ fill:none; stroke-width:1.2; } .traj .orb-p{ fill:none; stroke:#fff; stroke-width:2; } .traj .pt-e{ fill:#6FA8FF; } .traj .pt-t{ fill:#E07A4F; }
.traj text{ fill:#fff; font:12px var(--f); }
figure{ margin:0 0 10px; } figcaption{ font-size:12.5px; line-height:1.45; color:var(--ink-2); margin-top:6px; }
.real img{ width:100%; max-width:600px; height:auto; display:block; background:#000; }
@media (max-width: 720px){
  #page.is-mission{ overflow-y:auto; display:block; }
  .mission{ flex-direction:column; }
  #stage.m-stage{ flex:none; height:46vh; min-height:300px; }
  .m-hint{ display:none; }
  .m-tools .lbl{ display:none; }
  .m-b{ padding:0 11px; } .m-ex input{ width:84px; }
  .m-tools{ bottom:8px; }
  .m-hud{ top:10px; }
  .m-panel{ width:auto; border-left:0; }
}

/* ---------- accueil « Système solaire » : mise en page du « Ciel » d'Observatories (.home…, inst.css) ---------- */
#page.is-solar{ padding:0; }
.home.solar{ min-height:100%; }
.so-sky{ padding:0; height:calc(100vh - 300px); min-height:340px; overflow:hidden; }
.so-sky svg{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; font-family:var(--f); }
.so-sky .home-zoom{ flex-wrap:wrap; justify-content:flex-end; left:16px; }
.so-sky .home-zoom button{ background:rgba(5,7,10,.75); }
.so-ctl .dep-b{ font-size:12px; }
.so-ctl .home-yr{ min-width:0; flex:0 1 auto; }
.so-fut{ display:inline-block; font-size:11.5px; font-weight:700; margin-left:6px; padding:1px 6px; border:1px solid var(--ink); }
.so-sel{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.so-sel select{ font:inherit; font-weight:400; padding:4px 6px; background:var(--paper); color:var(--ink); border:1px solid var(--ink); }
.so-o{ fill:none; stroke-width:1px; stroke-opacity:.55; }
.so-mo{ stroke:#9FB3C8; stroke-opacity:.45; }
.so-tr{ fill:none; stroke-width:1.6px; }
.so-tr.done{ stroke-opacity:.35; stroke-dasharray:4 3; }
.so-sun{ fill:#FFD54F; }
.so-moon{ fill:#E3E6E8; }
.so-p{ stroke:#05070A; stroke-width:1.5px; }
.so-ring{ fill:none; stroke-width:2px; }
.so-sky text{ fill:#E3E6E8; font-size:12px; font-weight:600; paint-order:stroke; stroke:#05070A; stroke-width:3px; stroke-linejoin:round; }
.so-sky text.so-ml{ font-weight:400; fill:#C9D2DA; }
.so-scale path{ fill:none; stroke:#E3E6E8; stroke-width:1.5px; }
.so-sky .home-tip{ transform:translateY(-50%); }
.home-li b{ font-weight:700; }
.solar .home-li[aria-pressed="false"]{ opacity:1; }
.solar .home-li[aria-pressed="false"] i{ outline:0; }
.solar .home-li[aria-pressed="true"]{ border-color:var(--mark); box-shadow:inset 4px 0 0 var(--mark); background:var(--sheet); }
#so-probes .home-li small{ grid-column:2 / 4; }
@media (max-width: 860px){ .so-sky{ height:min(110vw, 70vh); min-height:300px; } .so-sky .home-zoom{ top:8px; right:8px; left:8px; } }

/* ---------- Flotte et Comparer : mise en page d'Observatories (.inst-nav, .inst-head, .ctable…, inst.css) ---------- */
#page.is-xp{ padding:0; overflow:hidden; display:flex; }
.xp{ flex:1; min-width:0; }
a.nav-i{ color:inherit; text-decoration:none; }
.inst-head h2.inst-name{ margin:0; }
.isec h3{ font-weight:800; font-stretch:75%; font-size:17px; margin:0 0 10px; padding-bottom:5px; border-bottom:2px solid var(--ink); }
.inst-head .fl-filters{ margin:0; }
.fl-grid{ stroke:var(--rule); stroke-width:1; }
.fl-year{ font-size:11px; fill:var(--ink-2); }
.fl-lab{ font-size:12.5px; font-weight:700; fill:var(--ink); }
.fl-tl svg{ font-family:var(--f); }
.fl-ev{ fill:var(--paper); stroke:var(--ink); stroke-width:1.5; }
.fl-nowt{ font-size:11px; }
.fl-leg{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12.5px; color:var(--ink-2); margin:8px 0 0; }
.fl-leg span{ display:inline-flex; align-items:center; gap:6px; }
.fl-leg svg{ width:16px; height:16px; fill:var(--paper); stroke:var(--ink); stroke-width:1.5; }
.fl-live{ display:inline-block; width:22px; height:8px; background:var(--ink-2); clip-path:polygon(0 0, 75% 0, 100% 50%, 75% 100%, 0 100%); }
.fl-who h3{ margin:0 0 4px; font-size:15px; } .fl-who h3 a{ color:var(--ink); }
.fl-who h3 small{ font-weight:400; color:var(--mute); font-size:12px; margin-left:6px; }
.ctable td.o a{ color:var(--ink); }
.ctable td small{ color:var(--mute); }
.ctable td.o .cp-sec{ display:block; font-weight:400; font-stretch:100%; font-size:11.5px; }
.cp-rows td.n{ white-space:normal; width:24%; }
.cp-bars{ list-style:none; padding:0; margin:6px 0 0; }
.cp-bars li{ display:grid; grid-template-columns:120px 1fr; grid-template-rows:auto auto; gap:2px 10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--rule); font-size:13px; }
.cp-n{ font-weight:800; font-stretch:75%; font-size:15px; color:var(--ink); grid-row:span 2; }
.cp-t{ height:14px; background:var(--sheet); } .cp-t i{ display:block; height:100%; }
.cp-v{ color:var(--ink-2); font-size:12.5px; }
#tabs .tab[aria-selected="true"] small{ opacity:1; }
.fl-who .spec-row .k{ max-width:none; }
.nav-i.on .k{ opacity:1; }
/* page « Mission et instruments » : cases et liens en <a> (pas de soulignement), source surlignée après un clic sur son numéro */
a.icard{ text-decoration:none; color:inherit; }
a.icard:focus-visible{ outline:2px solid var(--focus, #2F6FE4); outline-offset:-2px; }
.cov-row a:focus-visible rect:first-child{ stroke:var(--ink); stroke-width:1.5; }
ol.refs li.hl{ background:var(--mark, #FFE9A8); }
sup.ref a{ text-decoration:none; }
/* Système solaire : fond noir (carte schématique vue de dessus, sans ciel)  */
.so-sky{ background:#05070A; }
.so-orb{ fill:none; stroke-width:1.6px; }
.so-orb.hid{ stroke-dasharray:3 4; stroke-opacity:.5; }
/* barre de séparation entre l'en-tête et le contenu, comme la rangée du haut des pages Flotte et Comparer d'Observatories */
#top{ border-bottom:2px solid var(--ink); }

/* =================================================================

   Chaque valeur chiffrée porte un numéro de source (règle 1) ; les classements approchés sont signalés par « ≈ » (règle 2).

/* longueur d'onde en µm → texte lisible (nm, µm, mm, cm, m) */
function wl(um){
  if (um < 1) return num(um * 1000, um * 1000 < 100 ? 1 : 0) + ' nm';
  if (um < 1000) return num(um, um < 10 ? 2 : 1) + ' µm';
  if (um < 1e4) return num(um / 1000, 1) + ' mm';
  if (um < 1e6) return num(um / 1e4, 1) + ' cm';
  return num(um / 1e6, 1) + ' m';
}
function span(lo, hi){ var a = wl(lo), b = wl(hi); return a === b ? a : a + ' – ' + b; }
function range(it){ if (!it.bands || !it.bands.length) return L('hors spectre', 'not spectral');
  var lo = Math.min.apply(null, it.bands.map(function(b){ return b.lo; })), hi = Math.max.apply(null, it.bands.map(function(b){ return b.hi; }));
  return span(lo, hi); }
function color(it){ return (INST_TYPES[it.type] || INST_TYPES.radio).c; }
function kind(it){ return (INST_TYPES[it.type] || INST_TYPES.radio).l; }
function CAT(){ return (window.DATA_FILES || {}).cat || { cols:{}, cats:{} }; }
function cols(m, it){ return (CAT().cols[m.id] || []).filter(function(c){ return !it || c.inst === it.id; }); }
/* niveau de traitement : celui que déclare l'archive (CMR), sinon celui du nom de la collection (l1, l2…) */
function lvl(c){ var x = String(c.level || '').match(/\d/) || String(c.id).match(/(?:^|[-_])l(\d)/i); return x ? (x[1] || x[0]) : '?'; }
function catName(c){ var k = CAT().cats[c.cat]; return k ? k.label : c.cat; }
function period(c){ var a = c.first || (c.period || [])[0], b = c.last || (c.period || [])[1]; return (a ? String(a).slice(0, 10) : '…') + ' → ' + (b ? String(b).slice(0, 10) : L('en cours', 'ongoing')); }

/* ---------- sources : refs de la mission (MISSION), des instruments (INST_DATA), de la fiche (MISSIONS) et générales ---------- */
function refsOf(m){
  var r = {}, k, all = [m.refs || {}, (INST_DATA[m.id] || {}).refs || {}, (MISSION[m.id] || {}).refs || {}, MISSION_REFS];
  all.forEach(function(o){ for (k in o) r[k] = o[k]; }); return r;
}
function Marks(m){
  var refs = refsOf(m), nums = {}, n = 0;
  return {
    mark:function(keys){ var ks = [].concat(keys || []).filter(function(x){ return refs[x]; }); if (!ks.length) return '';
      return '<sup class="ref">' + ks.map(function(x){ if (!nums[x]) nums[x] = ++n; return '<a href="#ref-' + nums[x] + '" data-ref="' + nums[x] + '" aria-label="' + esc(L('source ', 'source ') + nums[x]) + '">' + nums[x] + '</a>'; }).join(',') + '</sup>'; },
    list:function(checked){
      var keys = Object.keys(nums).sort(function(a, b){ return nums[a] - nums[b]; }); if (!keys.length) return '';
      var c = (checked || '').split('-');
      return '<div class="isec wide"><h3>' + L('Sources', 'Sources') + '</h3><ol class="refs">' + keys.map(function(k){ var x = refs[k];
        return '<li id="ref-' + nums[k] + '"><a href="' + esc(x.u) + '" target="_blank" rel="noopener">' + esc(OBS_T(x.t)) + '</a> <span>' + esc(x.p) + '</span></li>'; }).join('') + '</ol>' +
        (checked ? '<p class="source-note">' + (en() ? 'Checked against the sources above on ' + checked + '.' : 'Vérifié le ' + c[2] + '/' + c[1] + '/' + c[0] + ' face aux sources ci-dessus.') + '</p>' : '') + '</div>';
    }
  };
}

/* ---------- couverture spectrale : axe logarithmique de l'ultraviolet à la radio ---------- */
var TICKS = [0.1, 0.3, 1, 3, 10, 30, 100, 1000, 1e4, 1e5, 1e6, 1e7, 1e8];
function coverage(m, sel){
  var list = INST_DATA[m.id].instruments.filter(function(it){ return it.bands && it.bands.length; });
  if (!list.length) return '';
  var lo = Infinity, hi = 0; list.forEach(function(it){ it.bands.forEach(function(b){ lo = Math.min(lo, b.lo); hi = Math.max(hi, b.hi); }); });
  lo = Math.pow(10, Math.floor(Math.log(lo) / Math.LN10 * 2) / 2); hi = Math.pow(10, Math.ceil(Math.log(hi) / Math.LN10 * 2) / 2);
  var W = 560, Lm = 80, R = 14, a = Math.log(lo), b = Math.log(hi);
  function X(v){ return Lm + (Math.log(Math.max(lo, Math.min(hi, v))) - a) / (b - a) * (W - Lm - R); }
  var y = 30, rows = list.map(function(it){ var r = { it:it, y:y, h:it.bands.length > 1 && overlap(it.bands) ? it.bands.length * 15 + 9 : 24 }; y += r.h; return r; });
  function overlap(bs){ for (var i = 1; i < bs.length; i++) if (bs[i].lo < bs[i - 1].hi) return true; return false; }
  var s = '<svg class="cov" viewBox="0 0 ' + W + ' ' + (y + 34) + '" role="group" aria-label="' + esc(L('Couverture spectrale des instruments de ', 'Spectral coverage of the instruments of ') + m.short) + '">' +
    '<defs><linearGradient id="gvis" x1="0" x2="1"><stop offset="0" stop-color="#7a5cff"/><stop offset="0.25" stop-color="#3fa0ff"/><stop offset="0.5" stop-color="#5fe07a"/><stop offset="0.72" stop-color="#ffd85a"/><stop offset="1" stop-color="#ff5a4a"/></linearGradient></defs>';
  if (lo < 0.75 && hi > 0.38){ s += '<rect x="' + X(0.38) + '" y="22" width="' + (X(0.75) - X(0.38)) + '" height="' + (y - 22) + '" fill="url(#gvis)" opacity="0.26"/><text class="cov-vis" x="' + ((X(0.38) + X(0.75)) / 2) + '" y="14" text-anchor="middle">' + L('visible', 'visible') + '</text>'; }
  var last = -99; TICKS.forEach(function(v){ if (v < lo || v > hi) return; var x = X(v); if (x - last < 38) return; last = x;
    s += '<line class="cov-grid" x1="' + x + '" y1="22" x2="' + x + '" y2="' + y + '"/><text class="cov-tick" x="' + x + '" y="' + (y + 15) + '" text-anchor="middle">' + wl(v).replace(/^0,|^0\./, en() ? '0.' : '0,') + '</text>'; });
  s += '<line class="cov-axis" x1="' + Lm + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/><text class="cov-unit" x="' + (W - R) + '" y="' + (y + 30) + '" text-anchor="end">' + L('longueur d\'onde, échelle logarithmique', 'wavelength, logarithmic scale') + '</text>';
  rows.forEach(function(r){
    var it = r.it, st = overlap(it.bands);
    s += '<g class="cov-row' + (it.id === sel ? ' sel' : '') + '"><a href="#' + m.id + '-donnees-' + it.id + '" aria-label="' + esc(it.name) + '"><rect x="0" y="' + r.y + '" width="' + W + '" height="' + r.h + '" fill="transparent"/>' +
      '<text class="cov-lab" x="4" y="' + (r.y + r.h / 2 + 4) + '">' + esc(it.name) + '</text>';
    it.bands.forEach(function(bd, i){ var x0 = X(bd.lo), w = Math.max(3, X(bd.hi) - x0), yy = r.y + 5 + (st ? i * 15 : 0);
      s += '<rect x="' + x0.toFixed(1) + '" y="' + yy + '" width="' + w.toFixed(1) + '" height="13" rx="2" fill="' + color(it) + '"' + (sel && it.id !== sel ? ' opacity="0.35"' : '') + '><title>' + esc(it.name + ' ' + bd.l + ' : ' + wl(bd.lo) + ' – ' + wl(bd.hi)) + '</title></rect>'; });
    s += '</a></g>';
  });
  return '<div class="svgwrap">' + s + '</svg></div>';
}

/* ---------- briques ---------- */
function table(rows, mk){
  return '<div class="stable">' + rows.map(function(r){ return '<div class="srow"><div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(OBS_NUM(r[1])) + (mk ? mk.mark(r[2]) : '') + '</div></div>'; }).join('') + '</div>';
}
var copyStore = [];
function code(text){ copyStore.push(text); return '<div class="codewrap"><pre class="code" tabindex="0" aria-label="' + L('Code', 'Code') + '">' + esc(text) + '</pre><button class="copy" data-copy="' + (copyStore.length - 1) + '">' + L('Copier', 'Copy') + '</button></div>'; }
function navItem(m, sec, cur, n, k, c){
  var on = sec === cur, h = '#' + m.id + '-donnees' + (sec ? '-' + sec : '');
  return '<a class="nav-i' + (on ? ' on' : '') + '" href="' + h + '"' + (on ? ' aria-current="page"' : '') + (c ? ' style="--c:' + c + '"' : '') + '><span class="n">' + esc(n) + '</span><span class="k">' + esc(k) + '</span></a>';
}
function get(m, id){ var a = INST_DATA[m.id].instruments; for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function realInst(m){ var key = m.real && m.real.key, d = key && (window.DATA_FILES || {})[key]; if (!d) return null;
  var n = String(d.instrument || '').toUpperCase(); return INST_DATA[m.id].instruments.filter(function(it){ return n.indexOf(it.name.toUpperCase()) >= 0; })[0] || null; }

/* ---------- vue d'ensemble ---------- */
function overview(m, X){
  var d = INST_DATA[m.id], mk = Marks(m), s = '';

  s += '<div class="inst-cols"><div class="isec"><h3>' + L('Couverture spectrale', 'Spectral coverage') + '</h3>' + coverage(m, null) +
    '<div class="cap">' + L('Plages reprises des pages d\'instruments, où chaque valeur renvoie à sa source. Les expériences de particules, de champs et de radioscience n\'ont pas de bande d\'observation : elles n\'apparaissent pas ici.', 'Ranges taken from the instrument pages, where each value cites its source. Particle, field and radio science investigations have no observing band and are not shown here.') + '</div></div>';
  var all = cols(m), cd = CAT().fetched;
  s += '<div class="isec"><h3>' + L('Données dans les catalogues', 'Data in the catalogues') + '</h3>' + (all.length ? table(all.map(function(c){
      var it = get(m, c.inst);
      return [(it ? it.name : c.inst) + ' · ' + c.id, (c.matched != null ? big(c.matched) + ' ' + (c.sat_filter ? L('produits de ce satellite', 'products from this satellite') : L('produits (toute la collection)', 'products (whole collection)')) : L('nombre non publié', 'count not published')) + ' · ' + catName(c), 'cat']; }), mk) +
    '<div class="cap">' + L('Relevé des catalogues le ', 'Catalogues surveyed on ') + esc(cd) + L('. Une même scène figure dans plusieurs collections (niveau 1, niveau 2…).', '. One scene appears in several collections (level 1, level 2…).') + '</div>'
    : '<p class="note">' + L('Catalogues pas encore relevés (workflow « Données réelles »).', 'Catalogues not surveyed yet (“Données réelles” workflow).') + '</p>') + '</div>';
  s += '<div class="isec wide"><h3>' + L('Instruments', 'Instruments') + '</h3><div class="icards">' + d.instruments.map(function(it){
    return '<a class="icard" style="--c:' + color(it) + '" href="#' + m.id + '-donnees-' + it.id + '"><span class="ic-n">' + esc(it.name) + '</span><span class="ic-k">' + esc(kind(it)) + '</span><span class="ic-r">' + esc(range(it)) + '</span></a>';
  }).join('') + '</div></div>';
  if (!realInst(m)) s += '<div class="isec wide"><h3>' + L('Une donnée réelle', 'Real data') + '</h3>' + X.real(m) + '</div>';
  s += '<div class="isec wide"><h3>' + L('Archives et documentation', 'Archives and documentation') + '</h3><div class="archs">' + d.archives.map(function(a){
    return '<a class="arch" href="' + esc(a.url) + '" target="_blank" rel="noopener"><span class="a-l">' + esc(a.label) + '</span><span class="a-d">' + esc(a.desc) + '</span><span class="a-u">' + esc(host(a.url)) + '</span></a>';
  }).join('') + '</div></div>';
  return s + mk.list() + '</div>';
}

/* ---------- mission et traitements ---------- */

  var M = MISSION[m.id], mk = Marks(m), s = '';

  s += '<div class="isec"><h3>' + L('Déroulé', 'Timeline') + '</h3><ol class="ms-tl">' + M.phases.map(function(p){
    return '<li><span class="ms-d">' + esc(p[0]) + '</span><div><strong>' + esc(p[1]) + '</strong>' + mk.mark(p[3]) + '<p>' + esc(OBS_NUM(p[2])) + '</p></div></li>'; }).join('') + '</ol></div>';
  s += '<div class="isec"><h3>' + L('Exploitation', 'Operations') + '</h3>' + table(M.ops, mk) + '</div>';
  /* chaîne : collections relevées dans les catalogues, rangées par niveau de traitement de la NASA */
  var by = {}; cols(m).forEach(function(c){ (by[lvl(c)] = by[lvl(c)] || []).push(c); });
  s += '<div class="isec wide"><h3>' + L('Chaîne de traitement', 'Processing chain') + '</h3><p class="ms-intro">' +
    L('Les mesures passent par des niveaux de traitement normalisés, du flux brut de l\'instrument aux cartes', 'Measurements go through standard processing levels, from the raw instrument stream to maps') + mk.mark('levels') +

    MISSION_LEVELS.map(function(v){ var a = by[v[0]] || [];
      return '<li><div class="ms-lv">' + L('Niveau ', 'Level ') + v[0] + '</div><div class="ms-st"><strong>' + esc(v[1]) + '</strong><p>' + esc(v[2]) + '</p><p>' +
        (a.length ? a.map(function(c){ var it = get(m, c.inst); return '<code>' + esc(c.id) + '</code> (' + esc(it ? it.name : c.inst) + ', ' + esc(catName(c)) + ')'; }).join(' · ')
          : L('aucune collection de ce niveau parmi celles relevées', 'no collection at this level among those surveyed')) + '</p></div></li>';
    }).join('') + '</ol></div>';
  return s + mk.list(M.checked) + '</div>';
}

/* ---------- orbite : trace au sol d'un tour, calculée par SGP4 à partir des éléments du jour (data/tle.json) ---------- */
var MU = 398600.4418, RE = 6378.137;   /* constante gravitationnelle et rayon équatorial de la Terre, km (WGS 84) */
function tleOf(m){ var d = (window.DATA_FILES || {}).tle; if (!d || !window.satellite) return null;
  return (m.norad || []).map(function(n){ var e = d.sats[String(n)]; if (!e) return null; var r = satellite.twoline2satrec(e.l1, e.l2); return r.error ? null : { n:n, e:e, rec:r }; }).filter(Boolean); }
function track(m, list){
  var W = 720, H = 360, t0 = Date.parse(list[0].e.epoch), segs = [];
  list.forEach(function(x, i){
    var per = 2 * Math.PI / x.rec.no, d = '', prev = null;
    for (var k = 0; k <= 240; k++){ var t = new Date(t0 + k / 240 * per * 60000), p = satellite.propagate(x.rec, t); if (!p.position) continue;
      var g = satellite.eciToGeodetic(p.position, satellite.gstime(t)), lo = satellite.degreesLong(g.longitude), la = satellite.degreesLat(g.latitude);
      var X = (lo + 180) / 360 * W, Y = (90 - la) / 180 * H;
      d += (prev === null || Math.abs(lo - prev) > 180 ? 'M' : 'L') + X.toFixed(1) + ' ' + Y.toFixed(1); prev = lo; }
    segs.push('<path d="' + d + '" class="gt' + (i ? ' gt2' : '') + '"/>');
  });
  var tex = (window.DATA_FILES || {})['tex-earth'];
  return '<figure class="traj gtrack"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(L('Trace au sol d\'un tour d\'orbite de ', 'Ground track of one orbit of ') + m.short) + '">' +
    (tex ? '<image href="data/tex-earth.jpg" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none" opacity="0.85"/>' : '<rect width="' + W + '" height="' + H + '" class="gt-bg"/>') +
    segs.join('') + '</svg><figcaption>' +
    L('Trace au sol d\'un tour complet à partir de l\'époque des éléments orbitaux (', 'Ground track of one full orbit from the epoch of the orbital elements (') + esc(list[0].e.epoch.replace('T', ' ').replace('Z', en() ? ' UTC' : ' TU')) + '), ' +
    L('calculée par SGP4 (satellite.js) à partir des éléments de CelesTrak téléchargés le ', 'computed by SGP4 (satellite.js) from CelesTrak elements downloaded on ') + esc(String((window.DATA_FILES.tle || {}).fetched).slice(0, 10)) + '. ' +
    L('Projection équirectangulaire. D\'un tour à l\'autre, la trace se décale vers l\'ouest parce que la Terre tourne dessous.', 'Equirectangular projection. From one orbit to the next, the track shifts west because the Earth turns underneath.') + '</figcaption></figure>';
}
function orbitSec(m){
  var mk = Marks(m), list = tleOf(m) || [], s = '<div class="inst-head"><div class="inst-h"><h2 class="inst-name">' + L('Orbite', 'Orbit') + '</h2><div class="inst-full">' + esc(m.name) + '</div></div><p class="inst-sum">' +
    L('Orbite réelle, calculée à partir des derniers éléments orbitaux publiés : la trace au sol d\'un tour, et les grandeurs qu\'on en tire.', 'Real orbit, computed from the latest published orbital elements: the ground track of one orbit, and the quantities derived from it.') + '</p></div><div class="inst-cols">';
  if (list.length){
    var r = list[0].rec, n = r.no / 60, a = Math.pow(MU / (n * n), 1 / 3), e = r.ecco;
    s += '<div class="isec wide"><h3>' + L('Trace au sol', 'Ground track') + '</h3>' + track(m, list) + '</div>';
    s += '<div class="isec"><h3>' + L('D\'après les éléments du jour', 'From today\'s elements') + mk.mark('ct') + '</h3>' + table([
      [L('Inclinaison', 'Inclination'), num(r.inclo * 180 / Math.PI, 2) + '°'],
      [L('Période', 'Period'), num(2 * Math.PI / r.no, 1) + ' min'],
      [L('Altitude (≈, au-dessus de l\'équateur)', 'Altitude (≈, above the equator)'), num(a * (1 - e) - RE, 0) + ' – ' + num(a * (1 + e) - RE, 0) + ' km'],
      [L('Excentricité', 'Eccentricity'), num(e, 5)],
      [L('Tours par jour', 'Orbits per day'), num(1440 / (2 * Math.PI / r.no), 2)]
    ]) + '<div class="cap">' + L('Calculé par ce site à partir des éléments moyens SGP4 (n° NORAD ', 'Computed by this site from the mean SGP4 elements (NORAD no. ') + list.map(function(x){ return x.n; }).join(', ') +
      L(') ; l\'altitude réelle varie aussi avec l\'aplatissement de la Terre (≈ 20 km entre l\'équateur et les pôles).', '); the real altitude also varies with the Earth\'s flattening (≈ 20 km between equator and poles).') + '</div></div>';
  } else s += '<div class="isec wide"><p class="note">' + L('Éléments orbitaux pas encore téléchargés (workflow « Données réelles »).', 'Orbital elements not downloaded yet (“Données réelles” workflow).') + '</p></div>';
  var sec = (m.sections || []).filter(function(x){ return /^Orbit/.test(x.title); })[0];
  if (sec) s += '<div class="isec"><h3>' + L('Orbite prévue', 'Planned orbit') + '</h3>' + table(sec.rows.map(function(r){ return [OBS_T(r[0]), OBS_T(r[1]), r[2]]; }), mk) + '</div>';
  return s + mk.list() + '</div>';
}

/* ---------- un instrument ---------- */
function stacCode(c){
  var api = c.api.replace(/\/$/, ''), f = c.sat_filter ? JSON.stringify(c.sat_filter) : '';
  return 'curl -X POST "' + api + '/search" -H "Content-Type: application/json" \\\n  -d \'{"collections": ["' + c.id + '"], "limit": 1' + (f ? ', "query": ' + f : '') + '}\'\n\n# Python\nfrom pystac_client import Client\ncat = Client.open("' + api + '")\nitems = cat.search(collections=["' + c.id + '"]' + (f ? ', query=' + f : '') + ', max_items=10).item_collection()\nfor it in items:\n    print(it.id, it.datetime, list(it.assets))';
}
/* pourquoi un instrument n'a pas encore d'illustration (manque signalé, règle 2) */
function noData(m, it){
  if (cols(m, it).length) return L('Pas encore d\'illustration : l\'aperçu public des produits de cet instrument ne montre pas sa mesure propre (les aperçus Landsat sont en couleurs naturelles, faits avec OLI-2).', 'No illustration yet: the public previews of this instrument\'s products do not show its own measurement (Landsat previews are natural colour, made with OLI-2).');
  return L('Pas encore d\'illustration : aucune collection de cet instrument relevée dans les catalogues.', 'No illustration yet: no collection for this instrument found in the catalogues.');
}
function detail(m, it, X){
  var mk = Marks(m), s = '', cs = cols(m, it);
  s += '<div class="inst-head"><div class="inst-h"><h2 class="inst-name">' + esc(it.name) + '</h2><div class="inst-full">' + esc(it.full) + '</div><span class="kind">' + esc(kind(it)) + '</span></div><div>' +
    '<p class="inst-use"><b>' + L('À quoi ça sert', 'What it is for') + '</b>' + esc(it.use) + '</p><p class="inst-sum">' + esc(OBS_NUM(it.summary)) + '</p>';
  if (it.bands && it.bands.length) s += '<div class="inst-range">' + it.bands.map(function(b){ return '<span class="rng" style="--c:' + color(it) + '"><b>' + esc(b.l) + '</b> ' + span(b.lo, b.hi) + '</span>'; }).join('') + '</div>';
  s += '</div></div><div class="inst-cols">';
  s += '<div class="isec"><h3>' + L('Caractéristiques', 'Characteristics') + '</h3>' + table(it.specs, mk) + '</div>';
  if (it.bands && it.bands.length) s += '<div class="isec"><h3>' + L('Place dans le spectre', 'Place in the spectrum') + '</h3>' + coverage(m, it.id) + '<div class="cap">' + L('Plages reprises des caractéristiques ci-dessus.', 'Ranges taken from the characteristics above.') + '</div></div>';
  s += Optics.section(m, it, mk, table);
  if (realInst(m) === it) s += '<div class="isec wide"><h3>' + L('Une donnée réelle', 'Real data') + '</h3>' + X.real(m) + '</div>';
  var ik = 'i-' + m.id + '-' + it.id, figs = [];
  if ((window.DATA_FILES || {})[ik] && realInst(m) !== it) figs.push(X.real(m, { key:ik, altRaw:L('Aperçu d\'un produit ', 'Preview of a product of ') + it.name }));
  if ((window.DATA_FILES || {})['d-' + ik.slice(2)]) figs.push(X.real(m, { key:'d-' + ik.slice(2), altRaw:L('Tracé des données de ', 'Plot of data from ') + it.name }));

  return '<figure class="real plot"><img src="data/' + R.key + '.jpg" width="' + out[0] + '" height="' + out[1] + '" alt="' + esc(R.altRaw || R.alt) + ' (' + esc(d.product) + ')">' +
    '<figcaption><strong>' + esc(T(d.instrument)) + ' · ' + esc(d.product) + '</strong><br>' + (d.datetime ? T('Date du produit dans le catalogue') + ' : ' + esc(String(d.datetime).slice(0, 10)) + '. ' : '') + esc(en ? d.how_en : d.how_fr) + '<br>' +
    T('Archive') + ' : ' + T(d.archive) + ' · ' + T('collection') + ' <code>' + esc(d.collection) + '</code> · <a href="' + esc(d.href) + '" rel="noopener" target="_blank">' + T('fichier de données') + '</a> · ' + T('téléchargé le') + ' ' + esc(d.fetched) + licLine(d) + '</figcaption></figure>';
}
/* image de presse (bibliothèque d'images de la NASA) : déjà traitée par l'équipe, ce n'est pas un produit d'archive */
function pressImage(m, R, d){
  var out = d.out_size, en = OBS_LANG === 'en';
  return '<figure class="real"><img src="data/' + R.key + '.jpg" width="' + out[0] + '" height="' + out[1] + '" alt="' + esc(R.altRaw || R.alt) + ' (' + esc(d.product) + ')">' +
    '<figcaption><strong>' + esc(T(d.instrument)) + ' · ' + esc(d.product) + ' · ' + (en ? '“' : '« ') + esc(d.title) + (en ? '”' : ' »') + '</strong><br>' +
    (d.datetime ? T('Image publiée le') + ' ' + esc(String(d.datetime).slice(0, 10)) + '. ' : '') + esc(R.what || '') + ' ' +
    (en ? 'Whole image as published (' + d.full_size[0] + ' × ' + d.full_size[1] + ' pixels)' + (out[0] !== d.full_size[0] ? ', scaled to ' + out[0] + ' × ' + out[1] : '') + ', already processed by the team: a press image, not an archive product.'
        : 'Image entière telle que publiée (' + d.full_size[0] + ' × ' + d.full_size[1] + ' pixels)' + (out[0] !== d.full_size[0] ? ', ramenée à ' + out[0] + ' × ' + out[1] : '') + ', déjà traitée par l\'équipe : image de presse, pas un produit d\'archive.') + '<br>' +
    T('Crédit') + (en ? ': ' : ' : ') + esc(d.credit) + ' · ' + T(d.archive) + ' · <a href="' + esc(d.page) + '" rel="noopener" target="_blank">' + T('page de l\'image') + '</a> · ' + T('téléchargé le') + ' ' + esc(d.fetched) + licLine(d, true) +
    (R.why ? '<br><span class="note">' + esc(R.why) + '</span>' : '') + '</figcaption></figure>';
}
var PAGES = {
  accueil: function(){ return EarthPage.html(); },
};

function currentRoute(){ var r = (location.hash || '').replace(/^#/, '').replace(/^(en|fr)-/, ''); return r; }
function route(){
  var r = (location.hash || '').replace(/^#/, '').replace(/^(en|fr)-/, '') || 'accueil';
  if (r === 'missions'){ r = window.EO_LAST || MISSIONS[0].id; history.replaceState(null, '', '#' + ((location.hash.match(/^#((?:en|fr)-)/) || [])[1] || '') + r); }   /* « Missions » ouvre la vue 3D de la dernière sonde vue */
  var dm = /^(\w+)-donnees(?:-([\w-]+))?$/.exec(r), m = mission(dm ? dm[1] : r);
  if (m) window.EO_LAST = m.id;
  var xp = !m && Views.page(r);   /* Flotte, Comparer et leurs sous-pages */
  if (!m && !xp && !PAGES[r]) r = 'accueil';
  renderHeader(m ? m.id + (dm ? '-donnees' + (dm[2] && /^(mission|orbite)$/.test(dm[2]) ? '-' + dm[2] : '') : '') : Views.base(r));
  $('page').innerHTML = m ? (dm ? MissionPage.html(m, dm[2] || '', { real:realData }) : missionPage(m)) : xp || PAGES[r]();
  $('page').classList.toggle('is-mission', !!(m && !dm));
  $('page').classList.toggle('is-xp', !!(xp || dm));
  $('page').classList.toggle('is-solar', !m && !xp && r === 'accueil');
  if (m && !dm) mountMission(m);
  if (!m && r === 'accueil') EarthPage.mount(); else EarthPage.stop();
  var h2 = $('page').querySelector('h2');
  document.title = (h2 ? h2.textContent + ' · ' : '') + T('Observateurs de la Terre');
  $('live').textContent = h2 ? h2.textContent : '';
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('#b-lang,#b-theme,[data-go],[data-ptab],[data-part],[data-body]') : null;
  if (!el) return;
  var cm = mission((location.hash || '').replace(/^#/, '').replace(/^(en|fr)-/, ''));
  if (el.hasAttribute('data-ptab') && cm){ MS.tab = el.getAttribute('data-ptab'); renderPanel(cm); return; }
  if (el.hasAttribute('data-part') && cm){ var k = el.getAttribute('data-part'); MS.part = MS.part === k ? null : k; Viewer.select(MS.part); renderPanel(cm); var b = document.querySelector('[data-part="' + k + '"]'); if (b) b.focus(); return; }
  if (el.hasAttribute('data-body')){ window.EO_BODY = el.getAttribute('data-body'); window.EO_BODY_LOCK = true; renderHeader(currentRoute()); window.EO_BODY_LOCK = false;
    var f = document.querySelector('#tabs .trow .tab'); if (f) f.focus(); return; }
  if (el.id === 'b-lang'){ var nl = OBS_LANG === 'en' ? 'fr' : 'en'; try { localStorage.setItem('eo-lang', nl); } catch(x){} location.hash = nl + '-' + (location.hash || '').replace(/^#/, '').replace(/^(en|fr)-/, ''); location.reload(); return; }
  if (el.id === 'b-theme'){ var nt = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nt); try { localStorage.setItem('eo-theme', nt); } catch(x){} route(); $('b-theme').focus(); return; }
  location.hash = el.getAttribute('data-go');
});
/* onglets des sondes : flèches gauche/droite, début, fin (motif « tablist ») */
document.addEventListener('keydown', function(e){
  var t = e.target.closest && e.target.closest('#tabs [role="tab"]'); if (!t) return;
  var all = [].slice.call(document.querySelectorAll('#tabs [role="tab"]')), i = all.indexOf(t), n = all.length, j = -1;
  if (e.key === 'ArrowRight') j = (i + 1) % n; else if (e.key === 'ArrowLeft') j = (i - 1 + n) % n; else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = n - 1;
  if (j < 0) return; e.preventDefault(); location.hash = all[j].getAttribute('data-go');
  setTimeout(function(){ var a = document.querySelector('#tabs [aria-selected="true"]'); if (a) a.focus(); }, 0);
});
window.addEventListener('hashchange', route);
OBS_I18N.static();
route();
window.__eo = { route:route, mission:mission };
})();
